name: Mirror symbols

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      max_builds:
        description: 'Most builds to mirror in this run'
        default: '100'

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Mirror new symbol artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_BUILDS: ${{ inputs.max_builds || '100' }}
        run: bash mirror.sh

      # Committing the index also counts as repo activity, which stops GitHub
      # disabling the schedule after 60 quiet days.
      - name: Commit index
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Update index"
            git push
          fi
